<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Database Integrated Blog System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <header>
      <h1>Tech Blog Dashboard</h1>
      <p class="status-badge">🟢 Connected to Backend API (Port 5000)</p>
    </header>

    <div class="main-content">
      <!-- Left Column: Forms -->
      <div class="control-panel">
        <!-- Secure Registration Section -->
        <section class="card">
          <h2>🔐 Secure Registration</h2>
          <form id="registerForm">
            <input type="email" id="regEmail" placeholder="Email Address" required />
            <input type="password" id="regPassword" placeholder="Secure Password" required />
            <button type="submit" class="btn btn-success">Encrypt & Register</button>
          </form>
          <div id="authMessage" class="message"></div>
        </section>

        <!-- Create Blog Section -->
        <section class="card">
          <h2>➕ Create a New Blog Post</h2>
          <form id="blogForm">
            <input type="text" id="blogTitle" placeholder="Post Title" required />
            <input type="text" id="blogAuthor" placeholder="Author Name" required />
            <textarea id="blogContent" placeholder="Write blog content here..." rows="6" required></textarea>
            <button type="submit" class="btn btn-primary">Publish to Database</button>
          </form>
          <div id="blogMessage" class="message"></div>
        </section>
      </div>

      <!-- Right Column: Live Feed -->
      <div class="feed-panel">
        <section class="card">
          <div class="feed-header">
            <h2>📚 Live Database Feed</h2>
            <button id="refreshBtn" class="btn btn-secondary">🔄 Refresh</button>
          </div>
          <div id="blogsContainer" class="blogs-list">
            <p class="loading-text">Loading posts from MongoDB cluster...</p>
          </div>
        </section>
      </div>
    </div>
  </div>

  <!-- Modal for Individual Blog Details -->
  <div id="blogModal" class="modal">
    <div class="modal-content">
      <span class="close-btn">&times;</span>
      <h1 id="modalTitle"></h1>
      <p id="modalMeta" class="modal-meta"></p>
      <hr />
      <p id="modalContent" class="modal-body"></p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
